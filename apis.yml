aid: unite-us
name: Unite Us
description: >-
  Unite Us is the software and data infrastructure company for coordinating
  whole-person care across healthcare, government, and community-based
  organizations. Its platform screens people for social determinants of health,
  sends closed-loop referrals to community services, and tracks outcomes, with
  EHR and case-management integrations (Epic, Oracle Health, Meditech,
  Salesforce) delivered through FHIR APIs, SMART on FHIR apps, and other HL7
  protocols aligned with Gravity Project standards. The platform is
  HIPAA-compliant and HITRUST, SOC 2 Type 2, and NIST CSF certified. API and
  integration documentation is gated to licensed network partners.
